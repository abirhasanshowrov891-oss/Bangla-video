<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বাংলা ভিডিও</title>

<script src="https://libtl.com/sdk.js"
data-zone="11729340"
data-sdk="show_11729340"></script>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
}

h1{
padding:20px;
margin:0;
}

.video-list{
padding:10px;
}

.video-button{
display:block;
width:90%;
max-width:500px;
margin:15px auto;
padding:18px;
border:0;
border-radius:12px;
background:#2196f3;
color:white;
font-size:20px;
}

#msg{
color:#aaa;
margin:20px;
}

video{
width:90%;
max-width:700px;
margin:20px auto;
border-radius:12px;
}
</style>
</head>

<body>

<h1>🎬 বাংলা ভিডিও</h1>

<div class="video-list">

<button class="video-button" onclick="watchVideo(1)">
🎬 ভিডিও ১ দেখুন
</button>

<button class="video-button" onclick="watchVideo(2)">
🎬 ভিডিও ২ দেখুন
</button>

<button class="video-button" onclick="watchVideo(3)">
🎬 ভিডিও ৩ দেখুন
</button>

</div>

<p id="msg">ভিডিও দেখতে একটি বাটনে চাপুন।</p>

<video id="video" controls style="display:none;">
<source id="videoSource" type="video/mp4">
</video>

<script>

const videos = {

1: "https://drive.google.com/uc?export=download&id=1oBxLREAj7Ux0zRSf-RTr4NiOKzQ3f52y",

2: "https://drive.google.com/uc?export=download&id=1oBxLREAj7Ux0zRSf-RTr4NiOKzQ3f52y",

3: "https://drive.google.com/uc?export=download&id=1oBxLREAj7Ux0zRSf-RTr4NiOKzQ3f52y"

};

function watchVideo(number){

const msg = document.getElementById("msg");
const video = document.getElementById("video");
const source = document.getElementById("videoSource");

msg.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

if(typeof show_11729340 !== "function"){

msg.innerText =
"বিজ্ঞাপন লোড হয়নি। Telegram-এর ভিতর থেকে আবার চেষ্টা করুন।";

return;
}

show_11729340({

ymid: "video_" + number,

requestVar: "video_" + number

}).then(function(){

source.src = videos[number];

video.load();

video.style.display = "block";

msg.innerText =
"✅ বিজ্ঞাপন দেখা হয়েছে। ভিডিও চালু হচ্ছে...";

video.play();

}).catch(function(error){

msg.innerText =
"❌ বিজ্ঞাপন দেখানো যায়নি। আবার চেষ্টা করুন।";

console.log(error);

});

}

</script>

</body>
</html>
