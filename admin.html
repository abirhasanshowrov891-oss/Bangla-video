<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলা ভিডিও - Admin</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial;
}
h1{text-align:center}
.box{
  max-width:500px;
  margin:auto;
  background:#222;
  padding:20px;
  border-radius:15px;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:8px;
}
button{
  background:#2196f3;
  color:white;
  font-size:17px;
}
</style>
</head>

<body>

<div class="box">
<h1>🎬 Admin Panel</h1>

<input id="title" type="text" placeholder="ভিডিওর নাম">

<input id="fileid" type="text" placeholder="Telegram File ID">

<button onclick="addVideo()">➕ ভিডিও যোগ করুন</button>

<p id="msg"></p>
</div>

<script>
const SUPABASE_URL = "তোমার-Supabase-URL";
const SUPABASE_KEY = "তোমার-Supabase-anon-key";

async function addVideo(){

const title = document.getElementById("title").value;
const file_id = document.getElementById("fileid").value;
const msg = document.getElementById("msg");

if(!title || !file_id){
msg.innerText = "❌ সব তথ্য পূরণ করো";
return;
}

const response = await fetch(
SUPABASE_URL + "/rest/v1/videos",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
title:title,
file_id:file_id,
views:0,
is_active:true
})
});

if(response.ok){
msg.innerText="✅ ভিডিও যোগ হয়েছে!";
document.getElementById("title").value="";
document.getElementById("fileid").value="";
}else{
msg.innerText="❌ ভিডিও যোগ হয়নি";
}
}
</script>

</body>
</html>
