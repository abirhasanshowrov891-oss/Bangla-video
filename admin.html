<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলা ভিডিও Admin</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
.box{
  max-width:500px;
  margin:auto;
  background:#222;
  padding:20px;
  border-radius:15px;
}
h1{text-align:center}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:8px;
}
button{
  background:#2196f3;
  color:white;
  font-size:17px;
}
#msg{text-align:center}
</style>
</head>

<body>

<div class="box">
<h1>🎬 বাংলা ভিডিও Admin</h1>

<input id="title" type="text" placeholder="ভিডিওর নাম">

<input id="fileid" type="text" placeholder="Telegram File ID">

<button onclick="addVideo()">➕ ভিডিও যোগ করুন</button>

<p id="msg"></p>
</div>

<script>
const SUPABASE_URL =
"https://zfqcfqdjcfetxxxesmkr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_guGzfcuoQ4Eh-u8eYeVDrw_6l8zdIlG";

async function addVideo(){

const title = document.getElementById("title").value.trim();
const file_id = document.getElementById("fileid").value.trim();
const msg = document.getElementById("msg");

if(!title || !file_id){
  msg.innerText = "❌ ভিডিওর নাম ও File ID দিন";
  return;
}

msg.innerText = "⏳ সংরক্ষণ হচ্ছে...";

try{

const response = await fetch(
SUPABASE_URL + "/rest/v1/videos",
{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=minimal"
},
body:JSON.stringify({
title:title,
file_id:file_id,
views:0,
is_active:true
})
});

if(response.ok){

msg.innerText = "✅ ভিডিও সফলভাবে যোগ হয়েছে!";

document.getElementById("title").value="";
document.getElementById("fileid").value="";

}else{

const errorText = await response.text();
console.log(errorText);

msg.innerText = "❌ যোগ হয়নি। Supabase permission চেক করতে হবে।";
}

}catch(error){

console.log(error);
msg.innerText = "❌ Connection error";

}

}
</script>

</body>
</html>
